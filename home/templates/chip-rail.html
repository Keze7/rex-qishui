<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="rex-widget" content="type=rail; height=96; item-ratio=1:1">
<title>榜单小卡</title>
<style>
*{box-sizing:border-box}
html,body{width:100%;margin:0;background:transparent}
body{font:13px/1.3 -apple-system,system-ui,sans-serif;color:#fff}
.chip{position:relative;width:100%;height:96px;border-radius:12px;overflow:hidden;background:linear-gradient(135deg,#5b5fe8,#8f6ce0);text-decoration:none}
.chip img{display:block;width:100%;height:100%;object-fit:cover}
.chip img:not([src]){visibility:hidden}
.shade{position:absolute;inset:0;background:linear-gradient(160deg,rgba(0,0,0,.35),rgba(0,0,0,.62))}
.copy{position:absolute;left:7px;right:7px;top:33%;text-align:center}
.title{margin:0;font-size:14px;line-height:1.25;font-weight:700;max-height:35px;overflow:hidden;text-shadow:0 1px 2px rgba(0,0,0,.35)}
.hit{position:absolute;inset:0;width:100%;height:100%;border:0;padding:0;background:transparent;color:transparent;cursor:pointer}
.hit:focus{outline:2px solid #fff;outline-offset:-3px;border-radius:12px}
.hit:disabled{cursor:default}
.tv .title{font-size:20px}
</style>
</head>
<body>
<div class="chip" id="chip">
  <img id="cover" alt="">
  <div class="shade"></div>
  <div class="copy"><p class="title" id="title"></p></div>
  <button type="button" class="hit" id="open" aria-label="打开" disabled></button>
</div>
<script>
(function () {
  var api = window.RexWidget;
  function el(id) { return document.getElementById(id); }
  var current = null;

  function render() {
    var page = api && api.content;
    var items = page && page.items ? page.items : [];
    current = items[0] || null;
    var src = current && (current.posterPath || current.detailPoster || current.coverUrl);
    if (src) el('cover').setAttribute('src', src);
    else el('cover').removeAttribute('src');
    el('title').textContent = current ? (current.title || '未命名') : '';
    var open = el('open');
    open.disabled = !current || !api.canOpen || !api.canOpen('item', current.id);
    open.setAttribute('aria-label', current ? '打开 ' + (current.title || '') : '打开');
  }

  function resize() {
    var layout = (api && api.layout) || {};
    el('chip').style.height = (layout.height || 96) + 'px';
    document.body.className = layout.platform === 'tvos' ? 'tv' : '';
  }

  el('open').addEventListener('click', function () {
    if (!current || !api) return;
    api.open('item', current.id).catch(function () {});
  });

  if (!api) return;
  api.onContentChanged(render);
  api.onLayoutChanged(resize);
  resize();
  render();
})();
</script>
</body>
</html>
