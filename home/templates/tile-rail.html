<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="rex-widget" content="type=rail; height=150; item-ratio=4:5">
<title>压字方卡</title>
<style>
*{box-sizing:border-box}
html,body{width:100%;margin:0;background:transparent}
body{font:13px/1.3 -apple-system,system-ui,sans-serif;color:#fff}
.tile{position:relative;width:100%;height:150px;border-radius:14px;overflow:hidden;background:rgba(128,128,140,.25)}
.tile img{display:block;width:100%;height:100%;object-fit:cover}
.tile img:not([src]){visibility:hidden}
.shade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.18) 0%,rgba(0,0,0,0) 38%,rgba(0,0,0,.42) 62%,rgba(0,0,0,.88) 100%)}
.copy{position:absolute;left:11px;right:11px;bottom:10px}
.title{margin:0;font-size:14px;line-height:1.28;font-weight:700;max-height:36px;overflow:hidden;text-shadow:0 1px 3px rgba(0,0,0,.45)}
.meta{margin:4px 0 0;font-size:10.5px;color:rgba(255,255,255,.72);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hit{position:absolute;inset:0;width:100%;height:100%;border:0;padding:0;background:transparent;color:transparent;cursor:pointer}
.hit:focus{outline:2px solid #fff;outline-offset:-3px;border-radius:14px}
.hit:disabled{cursor:default}
.tv .title{font-size:22px}
.tv .meta{font-size:17px}
</style>
</head>
<body>
<div class="tile" id="tile">
  <img id="cover" alt="">
  <div class="shade"></div>
  <div class="copy">
    <p class="title" id="title"></p>
    <p class="meta" id="meta"></p>
  </div>
  <button type="button" class="hit" id="open" aria-label="打开" disabled></button>
</div>
<script>
(function () {
  var api = window.RexWidget;
  function el(id) { return document.getElementById(id); }
  var current = null;

  function meta(item) {
    if (!item) return '';
    if (item.description) return String(item.description);
    var people = item.peoples || [];
    for (var i = 0; i < people.length; i++) {
      if (people[i] && people[i].title) return String(people[i].title);
    }
    return item.durationText ? String(item.durationText) : '';
  }

  function render() {
    var page = api && api.content;
    var items = page && page.items ? page.items : [];
    current = items[0] || null;
    var src = current && (current.posterPath || current.detailPoster || current.coverUrl);
    if (src) el('cover').setAttribute('src', src);
    else el('cover').removeAttribute('src');
    el('title').textContent = current ? (current.title || '未命名') : '';
    el('meta').textContent = meta(current);
    var open = el('open');
    open.disabled = !current || !api.canOpen || !api.canOpen('item', current.id);
    open.setAttribute('aria-label', current ? '打开 ' + (current.title || '') : '打开');
  }

  function resize() {
    var layout = (api && api.layout) || {};
    var height = layout.height || 150;
    el('tile').style.height = height + 'px';
    document.body.className = layout.platform === 'tvos' ? 'tv' : '';
  }

  el('open').addEventListener('click', function () {
    if (!current || !api) return;
    api.open('item', current.id).catch(function () {});
  });

  if (!api) return;
  api.onContentChanged(render);
  api.onLayoutChanged(resize);
  resize();
  render();
})();
</script>
</body>
</html>
