<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="rex-widget" content="type=full-width; height=176">
<title>每日推荐大卡</title>
<style>
*{box-sizing:border-box}
html,body{width:100%;margin:0;background:transparent}
body{font:13px/1.3 -apple-system,system-ui,sans-serif;color:#fff;-webkit-user-select:none}
@media (prefers-color-scheme:light){body{color:#111}}
.hero{position:relative;display:flex;align-items:center;height:176px;padding:0 18px;border-radius:18px;overflow:hidden;background:linear-gradient(115deg,rgba(250,44,90,.28),rgba(120,80,220,.18) 55%,rgba(255,255,255,.04));border:1px solid rgba(255,255,255,.09)}
.art{position:relative;flex:0 0 auto;width:132px;height:132px;border-radius:14px;overflow:hidden;background:rgba(128,128,140,.25)}
.art img{display:block;width:100%;height:100%;object-fit:cover}
.art img:not([src]){visibility:hidden}
.copy{flex:1 1 auto;min-width:0;margin-left:16px}
.label{margin:0;font-size:10px;letter-spacing:1.5px;font-weight:600;color:rgba(255,255,255,.7);text-transform:uppercase}
@media (prefers-color-scheme:light){.label{color:rgba(60,60,67,.65)}}
.title{margin:7px 0 0;font-size:19px;line-height:1.25;font-weight:700;max-height:48px;overflow:hidden}
.meta{margin:7px 0 0;font-size:11.5px;color:rgba(255,255,255,.6);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@media (prefers-color-scheme:light){.meta{color:rgba(60,60,67,.6)}}
.go{display:inline-block;margin-top:12px;padding:5px 12px;border:0;border-radius:999px;background:#fa2c5a;color:#fff;font:600 11.5px/1.4 -apple-system,system-ui,sans-serif;cursor:pointer}
.go:focus{outline:2px solid #fff;outline-offset:2px}
.go:disabled{opacity:.45;cursor:default}
.hit{position:absolute;inset:0;width:100%;height:100%;border:0;padding:0;background:transparent;color:transparent;cursor:pointer}
.hit:focus{outline:2px solid #fff;outline-offset:-3px;border-radius:18px}
</style>
</head>
<body>
<div class="hero" id="hero">
  <div class="art"><img id="cover" alt=""></div>
  <div class="copy">
    <p class="label" id="label">每日推荐</p>
    <p class="title" id="title"></p>
    <p class="meta" id="meta"></p>
    <button type="button" class="go" id="go" disabled>查看全部</button>
  </div>
  <button type="button" class="hit" id="hit" aria-label="打开每日推荐" disabled></button>
</div>
<script>
(function () {
  var api = window.RexWidget;
  function el(id) { return document.getElementById(id); }
  var current = null;

  function openList() {
    if (!api) return;
    api.open('list').catch(function () { el('meta').textContent = '暂时打不开列表'; });
  }

  function render() {
    var page = api && api.content;
    var items = page && page.items ? page.items : [];
    current = items[0] || null;
    var src = current && (current.posterPath || current.detailPoster || current.coverUrl);
    if (src) el('cover').setAttribute('src', src);
    else el('cover').removeAttribute('src');
    el('label').textContent = items.length ? '每日推荐 · ' + items.length + ' 首' : '每日推荐';
    el('title').textContent = current ? (current.title || '今天的推荐') : '今天的推荐';
    var artist = current && current.description ? String(current.description) : '';
    el('meta').textContent = artist || '每天换一批，按你的口味排';
    el('go').disabled = !current || !api.canOpen || !api.canOpen('list');
    el('hit').disabled = !current || !api.canOpen || !api.canOpen('item', current.id);
  }

  function resize() {
    var layout = (api && api.layout) || {};
    var height = layout.height || 176;
    el('hero').style.height = height + 'px';
    var art = Math.min(132, Math.round(height - 44));
    var box = el('hero').querySelector('.art');
    box.style.width = art + 'px';
    box.style.height = art + 'px';
  }

  el('hit').addEventListener('click', function () {
    if (!current || !api) return;
    api.open('item', current.id).catch(function () { el('meta').textContent = '暂时打不开这一首'; });
  });
  el('go').addEventListener('click', function (event) {
    event.stopPropagation();
    openList();
  });

  if (!api) return;
  api.onContentChanged(render);
  api.onLayoutChanged(resize);
  resize();
  render();
})();
</script>
</body>
</html>
