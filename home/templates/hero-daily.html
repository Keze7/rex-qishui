<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="rex-widget" content="type=full-width; height=190">
<meta name="rex-artwork" content="palette">
<title>每日推荐大卡</title>
<style>
*{box-sizing:border-box}
html,body{width:100%;margin:0;background:transparent}
body{font:13px/1.3 -apple-system,system-ui,sans-serif;color:#fff;-webkit-user-select:none}
.hero{position:relative;display:flex;align-items:center;height:190px;padding:0 18px;border-radius:18px;overflow:hidden;background:linear-gradient(100deg,#2a2c34,#14151a);border:1px solid rgba(255,255,255,.1)}
.art{position:relative;flex:0 0 auto;width:132px;height:132px;border-radius:14px;overflow:hidden;background:rgba(255,255,255,.12)}
.art img{display:block;width:100%;height:100%;object-fit:cover}
.art img:not([src]){visibility:hidden}
.copy{position:relative;flex:1 1 auto;min-width:0;margin-left:16px}
.label{margin:0;font-size:10px;line-height:1.4;letter-spacing:1.2px;font-weight:700;color:rgba(255,255,255,.72)}
.title{margin:6px 0 0;font-size:20px;line-height:1.24;font-weight:700;max-height:50px;overflow:hidden}
.meta{margin:6px 0 0;font-size:11.5px;color:rgba(255,255,255,.62);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.go{margin-top:11px;padding:5px 13px;border:0;border-radius:999px;background:#fff;color:#111;font:600 11.5px/1.5 -apple-system,system-ui,sans-serif;cursor:pointer}
.go:focus{outline:2px solid #fff;outline-offset:2px}
.go:disabled{opacity:.4;cursor:default}
.hit{position:absolute;inset:0;width:100%;height:100%;border:0;padding:0;background:transparent;color:transparent;cursor:pointer}
.hit:focus{outline:2px solid #fff;outline-offset:-3px;border-radius:18px}
</style>
</head>
<body>
<div class="hero" id="hero">
  <div class="art"><img id="cover" alt=""></div>
  <div class="copy">
    <p class="label" id="label">每日推荐</p>
    <p class="title" id="title"></p>
    <p class="meta" id="meta"></p>
    <button type="button" class="go" id="go" disabled>查看全部</button>
  </div>
  <button type="button" class="hit" id="hit" aria-label="打开每日推荐" disabled></button>
</div>
<script>
(function () {
  var api = window.RexWidget;
  function el(id) { return document.getElementById(id); }
  var current = null;
  var tint = '';

  // 宿主取色：封面的主色压暗成渐变铺底，白字始终有对比度；拿不到就退回深灰
  function paint() {
    var hero = el('hero');
    var style = tint && api && api.artwork ? api.artwork(tint) : null;
    var hex = style && style.background ? String(style.background).replace('#', '') : '';
    var m = /^([0-9a-f]{2})([0-9a-f]{2})([0-9a-f]{2})$/i.exec(hex);
    if (!m) return;
    var rgb = parseInt(m[1], 16) + ',' + parseInt(m[2], 16) + ',' + parseInt(m[3], 16);
    hero.style.background = 'linear-gradient(100deg, rgba(' + rgb + ',.95), rgba(0,0,0,.78))';
  }

  function render() {
    var page = api && api.content;
    var items = page && page.items ? page.items : [];
    current = items[0] || null;
    var src = current && (current.posterPath || current.detailPoster || current.coverUrl);
    if (src && src !== tint) {
      tint = src;
      paint();
    }
    if (src) el('cover').setAttribute('src', src);
    else el('cover').removeAttribute('src');
    el('label').textContent = items.length ? '每日推荐 · ' + items.length + ' 首' : '每日推荐';
    el('title').textContent = current ? (current.title || '今天的推荐') : '今天的推荐';
    var artist = current && current.description ? String(current.description) : '';
    el('meta').textContent = artist || '每天换一批，按你的口味排';
    var go = el('go');
    go.textContent = items.length ? '查看全部 ' + items.length + ' 首' : '查看全部';
    go.disabled = !current || !api.canOpen || !api.canOpen('list');
    el('hit').disabled = !current || !api.canOpen || !api.canOpen('item', current.id);
  }

  function resize() {
    var layout = (api && api.layout) || {};
    var height = layout.height || 190;
    el('hero').style.height = height + 'px';
    var art = Math.min(136, Math.round(height - 46));
    var box = el('hero').querySelector('.art');
    box.style.width = art + 'px';
    box.style.height = art + 'px';
  }

  el('hit').addEventListener('click', function () {
    if (!current || !api) return;
    api.open('item', current.id).catch(function () { el('meta').textContent = '暂时打不开这一首'; });
  });
  el('go').addEventListener('click', function (event) {
    event.stopPropagation();
    if (!api) return;
    api.open('list').catch(function () { el('meta').textContent = '暂时打不开列表'; });
  });

  if (!api) return;
  api.onContentChanged(render);
  if (api.onArtworkChanged) api.onArtworkChanged(paint);
  api.onLayoutChanged(resize);
  resize();
  render();
})();
</script>
</body>
</html>
